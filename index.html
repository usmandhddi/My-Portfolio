<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usman Nizam ul Din | Portfolio</title>
    <style>
        :root {
            --primary: #2c3e50;
            --white: #ffffff;
            /* Vibrant Gradients */
            --grad-header: linear-gradient(135deg, #1A2980 0%, #26D0CE 100%); /* Blue to Teal */
            --grad-title: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);   /* Green Gradient */
            --grad-card: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
            --grad-btn: linear-gradient(45deg, #4776E6 0%, #8E54E9 100%);     /* Purple/Blue */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f0f2f5;
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header {
            background: var(--grad-header);
            color: var(--white);
            text-align: center;
            padding: 4rem 1.5rem 6rem;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
        }

        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
            background-color: #ddd;
        }

        header h1 {
            margin: 10px 0 5px;
            font-size: 2.2rem;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .titles {
            font-size: 1.1rem;
            color: #e0f7fa;
            font-weight: 500;
        }

        /* --- SOCIAL BAR --- */
        .social-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .social-btn {
            text-decoration: none;
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            transition: transform 0.2s;
        }
        .social-btn:hover { transform: translateY(-3px); background: rgba(255,255,255,0.4); }

        /* --- LAYOUT --- */
        .container {
            max-width: 1000px;
            margin: -60px auto 0;
            padding: 0 1.5rem 3rem;
            position: relative;
            z-index: 2;
        }

        section {
            background: var(--white);
            margin-bottom: 2rem;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            background: var(--grad-header);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            font-size: 1.7rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* --- ABOUT ME --- */
        .about-text {
            color: #555;
            font-size: 1.05rem;
            text-align: justify;
        }

        /* --- EXPERIENCE --- */
        .exp-item {
            border-left: 4px solid #26D0CE;
            padding-left: 20px;
            margin-bottom: 25px;
            background: #fafafa;
            padding: 15px 15px 15px 20px;
            border-radius: 0 10px 10px 0;
        }
        .role { font-weight: bold; font-size: 1.1rem; color: #2c3e50; }
        .company { color: #11998e; font-style: italic; font-weight: 600; }
        .date { font-size: 0.85rem; color: #888; display: block; margin-bottom: 5px; }

        /* --- SLIDER (AUTO + MANUAL) --- */
        .slider-container {
            width: 100%;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
            /* Hide scrollbar visually but allow function */
            scrollbar-width: none; 
            -ms-overflow-style: none;
            cursor: grab;
        }
        .slider-container::-webkit-scrollbar { 
            display: none; 
        }

        .slide-card {
            display: inline-block;
            width: 260px;
            background: var(--grad-card);
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 20px;
            margin-right: 15px;
            white-space: normal; /* Allow text wrapping inside card */
            vertical-align: top;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: 160px; /* Fixed height for uniformity */
            position: relative;
        }

        .cert-btn {
            display: block;
            margin-top: 10px;
            text-decoration: none;
            color: white;
            background: var(--grad-btn);
            padding: 6px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
            text-align: center;
            font-weight: bold;
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
        }

        /* --- LISTS (Seminars & Honors) --- */
        ul.custom-list {
            list-style: none;
            padding: 0;
        }
        ul.custom-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 12px;
            color: #444;
        }
        ul.custom-list li::before {
            content: '✔';
            position: absolute;
            left: 0;
            color: #26D0CE;
            font-weight: bold;
        }

        /* --- TESTIMONIALS --- */
        .testimonial-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .test-card {
            background: #fdfdfd;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            text-align: center;
        }
        .test-name { font-weight: bold; color: #2c3e50; margin-top: 10px; }
        .stars { color: #f1c40f; }

        /* --- FOOTER --- */
        footer {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 3rem 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }
        footer a { color: #26D0CE; text-decoration: none; }
    </style>
</head>
<body>

        <img src="1000215280.jpg" alt="Usman Nizam ul Din" class="profile-img">
        <h1>Usman Nizam ul Din</h1>
        <div class="titles">Academic Content Writer | Researcher | Marketing Specialist</div>
